<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatatan Stok</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        input, button { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="card">
        <h2>Login Stok App</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label>Username</label>
            <input type="text" id="username" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit" id="loginBtn">Masuk</button>
        </form>
        <p id="loginMsg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboardPage" class="card hidden" style="max-width: 700px;">
        <h2>Dashboard Stok Barang</h2>
        <button onclick="handleLogout()" style="background: #dc3545; width: auto; padding: 5px 15px; float: right;">Logout</button>
        <div style="clear: both;"></div>
        
        <hr style="margin: 15px 0;">
        
        <h3>Tambah Barang Baru</h3>
        <form id="stokForm" onsubmit="tambahStok(event)">
            <input type="text" id="kode" placeholder="Kode Barang" required>
            <input type="text" id="nama" placeholder="Nama Barang" required>
            <input type="number" id="jumlah" placeholder="Jumlah Stok" required>
            <input type="text" id="keterangan" placeholder="Keterangan">
            <button type="submit">Simpan Stok</button>
        </form>

        <h3>Daftar Stok</h3>
        <table>
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Nama</th>
                    <th>Jumlah</th>
                    <th>Keterangan</th>
                </tr>
            </thead>
            <tbody id="tabelStok">
                <!-- Data akan dimuat lewat JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Ganti URL di bawah dengan URL Web App dari Google Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbwkF85ZEmxJkl5NoJjqHnCOHe9TNCN6S5Cjv3FfXjgr4_O-5j4W1jWPhzTJhKrjX731/exec";

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.innerText = "Memproses...";
            btn.disabled = true;

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username, password })
            })
            .then(res => res.json())
            .then(res => {
                btn.innerText = "Masuk";
                btn.disabled = false;
                if(res.status === "success") {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('dashboardPage').classList.remove('hidden');
                    loadStok();
                } else {
                    document.getElementById('loginMsg').innerText = res.message;
                }
            })
            .catch(err => {
                btn.innerText = "Masuk";
                btn.disabled = false;
                document.getElementById('loginMsg').innerText = "Terjadi kesalahan koneksi.";
                console.error(err);
            });
        }

        function loadStok() {
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getStok" })
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    let tbody = document.getElementById('tabelStok');
                    tbody.innerHTML = "";
                    res.data.forEach(item => {
                        tbody.innerHTML += `<tr>
                            <td>${item.kode}</td>
                            <td>${item.nama}</td>
                            <td>${item.jumlah}</td>
                            <td>${item.keterangan}</td>
                        </tr>`;
                    });
                }
            });
        }

        function tambahStok(e) {
            e.preventDefault();
            const kode = document.getElementById('kode').value;
            const nama = document.getElementById('nama').value;
            const jumlah = document.getElementById('jumlah').value;
            const keterangan = document.getElementById('keterangan').value;

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "tambahStok", kode, nama, jumlah, keterangan })
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    alert("Berhasil menambah stok!");
                    document.getElementById('stokForm').reset();
                    loadStok();
                } else {
                    alert("Gagal menyimpan data.");
                }
            });
        }

        function handleLogout() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('loginMsg').innerText = "";
        }
    </script>
</body>
</html>
