<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Aplikasi Stok</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f0c1b; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; position: relative; }
        
        /* Shape Background Accents */
        .bg-glow-1 { position: absolute; width: 280px; height: 280px; background: radial-gradient(circle, rgba(236,72,153,0.35) 0%, rgba(0,0,0,0) 70%); top: -50px; left: -50px; border-radius: 50%; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, rgba(0,0,0,0) 70%); bottom: -60px; right: -60px; border-radius: 50%; pointer-events: none; }

        .app-container { width: 100%; max-width: 420px; z-index: 1; }
        
        /* Banner Header */
        .header-banner { background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); border-radius: 24px; padding: 28px 24px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25); position: relative; overflow: hidden; }
        .header-banner::after { content: ''; position: absolute; right: -20px; bottom: -20px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .header-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .header-subtitle { font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 400; }

        /* Card Container */
        .card { background: rgba(26, 21, 48, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 24px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4); }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { font-size: 13px; font-weight: 600; color: #a5a6f6; display: block; margin-bottom: 8px; margin-left: 4px; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: #7c7bad; font-size: 16px; }
        
        input { width: 100%; padding: 14px 16px 14px 46px; background: #130f26; border: 1px solid #2d284f; border-radius: 14px; color: #fff; font-size: 15px; transition: all 0.2s ease; outline: none; }
        input:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2); }
        input::placeholder { color: #5a577a; }

        .btn-primary { width: 100%; padding: 15px; margin-top: 10px; background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3); transition: transform 0.1s, opacity 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        #loginMsg { color: #f43f5e; font-size: 13px; text-align: center; margin-top: 14px; font-weight: 500; min-height: 18px; }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="app-container">
        <!-- Banner bergaya kartu seperti sampel gambar -->
        <div class="header-banner">
            <div class="header-title">Masuk Aplikasi</div>
            <div class="header-subtitle">Silakan login untuk mengelola pencatatan stok barang</div>
        </div>

        <div class="card">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn-primary">
                    <span>Masuk</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <p id="loginMsg"></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMsg');
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
            btn.disabled = true;
            msg.innerText = "";

            fetch(API_URL, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "login", username: username, password: password })
            })
            .then(res => res.json())
            .then(res => {
                btn.innerHTML = `<span>Masuk</span> <i class="fa-solid fa-arrow-right"></i>`;
                btn.disabled = false;
                if(res.status === "success") {
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", username);
                    window.location.href = "menu.html";
                } else {
                    msg.innerText = res.message;
                }
            })
            .catch(err => {
                btn.innerHTML = `<span>Masuk</span> <i class="fa-solid fa-arrow-right"></i>`;
                btn.disabled = false;
                msg.innerText = "Terjadi kesalahan koneksi.";
                console.error("Login error:", err);
            });
        }
    </script>
</body>
</html>
