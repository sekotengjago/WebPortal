<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Pencatatan Stok</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
        input, button { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 16px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            background: #007BFF; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Login Stok App</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label>Username</label>
            <input type="text" id="username" required autocomplete="username">
            <label>Password</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit" id="loginBtn">Masuk</button>
        </form>
        <p id="loginMsg" style="color: red; font-size: 14px; text-align: center;"></p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxfLmPjdIUrDr6Chp3uwni8JEfppWxApVYct5Fm12zd9PZ-dx1-6sKI1ZlCVHf_xJeY/exec";

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('loginMsg');
            
            btn.innerText = "Memproses...";
            btn.disabled = true;
            msg.innerText = "";

            fetch(API_URL, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "login", username: username, password: password })
            })
            .then(res => res.json())
            .then(res => {
                btn.innerText = "Masuk";
                btn.disabled = false;
                if(res.status === "success") {
                    // Simpan status sesi login sederhana ke localStorage
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", username);
                    
                    // Alihkan ke halaman stock.html
                    window.location.href = "stock.html";
                } else {
                    msg.innerText = res.message;
                }
            })
            .catch(err => {
                btn.innerText = "Masuk";
                btn.disabled = false;
                msg.innerText = "Terjadi kesalahan koneksi.";
                console.error("Login error:", err);
            });
        }
    </script>
</body>
</html>
